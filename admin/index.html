<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>内容管理 - SpruceSet</title>
  <link rel="icon" type="image/png" href="../spruceset-icon.png" />
</head>
<body>
  <!-- Decap CMS -->
  <script src="https://unpkg.com/decap-cms@3.6.4/dist/decap-cms.js"></script>
  <!-- Netlify Identity Widget（用于 GitHub 登录认证） -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    // 登录成功后跳转回 CMS
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/SpruceSet/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
