backend:
  name: git-gateway
  branch: gh-pages
  # Netlify Identity / Git Gateway 服务地址（用于 GitHub 登录认证）
  identity_url: https://preeminent-beignet-49b11d.netlify.app/.netlify/identity
  gateway_url: https://preeminent-beignet-49b11d.netlify.app/.netlify/git

# 上传的图片保存目录
media_folder: "images"
public_folder: "/images"

# 不启用草稿工作流，保存即发布
publish_mode: simple

collections:
  - name: "donate"
    label: "捐赠页管理"
    delete: false
    files:
      - file: "content/donate.json"
        name: "donate"
        label: "捐赠设置"
        fields:
          - label: "微信收款码"
            name: "wechat_qr"
            widget: "image"
            required: false
            hint: "上传微信收款码图片，建议正方形 400x400 以上"
          - label: "微信捐赠说明"
            name: "wechat_text"
            widget: "string"
            default: "扫码请开发者喝咖啡"
            hint: "微信卡片下方的说明文字"
          - label: "支付宝收款码"
            name: "alipay_qr"
            widget: "image"
            required: false
            hint: "上传支付宝收款码图片，建议正方形 400x400 以上"
          - label: "支付宝捐赠说明"
            name: "alipay_text"
            widget: "string"
            default: "扫码请开发者喝咖啡"
            hint: "支付宝卡片下方的说明文字"
          - label: "页面标题"
            name: "title"
            widget: "string"
            default: "支持开发者"
          - label: "捐赠引导语"
            name: "intro"
            widget: "text"
            default: "SpruceSet 是一款免费开源的桌面笔记软件，开发和维护需要投入大量时间和精力。如果 SpruceSet 对你有帮助，欢迎请开发者喝杯咖啡 ☕"
            hint: "捐赠页顶部的引导文字"
          - label: "资金用途"
            name: "fund_usage"
            widget: "list"
            label_singular: "用途"
            min: 1
            max: 6
            fields:
              - { label: "标题", name: "title", widget: "string" }
              - { label: "图标", name: "icon", widget: "string", default: "💰", hint: "Emoji 表情" }
              - { label: "描述", name: "desc", widget: "text" }
            default:
              - { title: "开发维护", icon: "💻", desc: "功能开发、缺陷修复、版本发布所需的时间与精力" }
              - { title: "基础设施", icon: "🌐", desc: "官网、在线手册与下载服务的托管费用" }
              - { title: "开发工具", icon: "🔧", desc: "代码签名证书、开发测试环境等必要开支" }
              - { title: "回馈上游", icon: "🤝", desc: "向本软件所依赖的开源社区回馈贡献" }
          - label: "捐赠条款"
            name: "terms"
            widget: "list"
            label_singular: "条款"
            min: 1
            max: 10
            fields:
              - { label: "标题", name: "title", widget: "string" }
              - { label: "内容", name: "content", widget: "text" }
            default:
              - { title: "完全自愿", content: "捐赠是您在完全自愿前提下的支持行为，不存在任何强制或诱导。是否捐赠、捐赠多少均不影响您使用本软件的全部功能。" }
              - { title: "非购买行为", content: "捐赠不构成任何商品或服务的购买，不形成任何债权债务关系，捐赠方不会因此获得除公开致谢之外的特殊权利或回报。" }
              - { title: "用途声明", content: "捐赠资金将全部用于本软件的版本更新、日常维护及相关基础设施建设，不以营利为目的。" }
              - { title: "不予退还", content: "捐赠一经完成即不可撤销、不可退还，请在捐赠前确认金额与意愿。" }
              - { title: "税务说明", content: "捐赠不属于公益慈善捐赠，无法开具公益捐赠票据或用于税前扣除。" }
              - { title: "未成年人", content: "未成年人进行捐赠应事先取得监护人同意。" }
              - { title: "条款变更", content: "本页条款如有更新，将在本页面公布，更新后立即生效。" }
          - label: "底部致谢语"
            name: "thanks"
            widget: "string"
            default: "感谢每一位支持 SpruceSet 的用户！"
